<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search — Hana Microelectronics</title>
<link rel="icon" type="image/svg+xml" href="images/hana-mark.svg">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/search.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="js/search-shell.js"></script>
<script src="js/search/packages.js"></script><script src="js/search/data.js"></script>
<script src="js/search/engine.js"></script>
<script type="text/babel" src="js/search/chrome.jsx"></script>
<script type="text/babel" src="js/search/views.jsx"></script>
<style id="__om-edit-overrides"></style>
</head>
<body style="margin:0; background:#fff; font-family:var(--font-text); -webkit-font-smoothing:antialiased;">
<div id="shell-h"></div>
<main id="root"></main>
<div id="shell-f"></div>
<script>
document.getElementById("shell-h").innerHTML = window.HS_SHELL.header;
document.getElementById("shell-f").innerHTML = window.HS_SHELL.footer;
</script>
<script type="text/babel">
const H = new URLSearchParams(location.hash.slice(1));
const P = H.get("p") || "F";
const q0 = H.has("q") ? H.get("q") : "ISO 13485";
const strip = H.get("strip") !== "0";
window.HS.setSmart(H.get("smart") !== "0");

function Frame() {
  const [q, setQ] = React.useState(q0);
  const mobile = window.innerWidth <= 900;
  const set = v => { setQ(v); try { parent.postMessage({ hsQuery: v }, "*"); } catch (e) {} };
  const shared = { q, setQ: set, strip, mobile };
  if (P === "D") return <CapabilitiesHub {...shared} />;
  if (P === "E") return <LocationsHub {...shared} />;
  return <ResultsPage {...shared} onClose={() => set("")} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Frame />);

/* Real site chrome uses Lucide glyphs and hover mega-menus. */
const paint = () => { if (window.lucide) window.lucide.createIcons(); };
paint();
new ResizeObserver(() => {
  try { parent.postMessage({ hsHeight: document.documentElement.scrollHeight }, "*"); } catch (e) {}
}).observe(document.body);
</script>
<script src="js/mega-menu.js"></script>
<script src="js/mobile-nav.js"></script>
</body>
</html>
