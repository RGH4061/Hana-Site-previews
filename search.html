<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Search — Hana Microelectronics</title>
<link rel="icon" type="image/svg+xml" href="images/hana-mark.svg">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/search.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body style="margin:0; background:#fff; font-family:var(--font-text); -webkit-font-smoothing:antialiased;">
<div id="shell-h"></div>
<main id="hs-search-page" class="hs-page">
  <div class="hs-eyebrow">Search</div>
  <div class="hs-searchhead">
    <div class="hs-fieldwrap">
      <div class="hs-field">
        <span class="hs-field-ico"><i data-lucide="search" style="width:21px;height:21px"></i></span>
        <input id="hs-q" type="search" spellcheck="false" placeholder="Search capabilities, markets, plants, certifications" aria-label="Search this site">
        <button id="hs-clear" class="hs-field-x" aria-label="Clear"><i data-lucide="x" style="width:17px;height:17px"></i></button>
      </div>
    </div>
  </div>
  <div id="hs-body"></div>
</main>
<div id="shell-f"></div>
<script src="js/search-shell.js"></script>
<script>
document.getElementById("shell-h").innerHTML = window.HS_SHELL.header;
document.getElementById("shell-f").innerHTML = window.HS_SHELL.footer;
</script>
<script src="js/search/data.js"></script>
<script src="js/search/engine.js"></script>
<script src="js/site-search.js"></script>
<script src="js/mega-menu.js"></script>
<script src="js/mobile-nav.js"></script>
<script>if (window.lucide) window.lucide.createIcons();</script>
</body>
</html>
